# 工作流名称：部署Quartz到GitHub Pages
name: Deploy Quartz to GitHub Pages

# 触发条件：推送到main分支时自动触发 / 支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 定义构建部署任务
jobs:
  build-and-deploy:
    # 运行环境选择Ubuntu最新版
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码（需完整Git历史，保证Quartz解析笔记时间线）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 步骤2：配置Node.js环境（匹配Quartz v4.5.2要求的≥22版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'  # 缓存npm依赖，加速后续构建

      # 步骤3：安装项目依赖（改用npm install避免严格依赖冲突）
      - name: Install dependencies
        run: npm install

      # 步骤4：构建Quartz静态网站（使用v4官方构建命令）
      - name: Build Quartz site
        run: npx quartz build

      # 步骤5：部署到GitHub Pages（自动生成gh-pages分支）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public  # Quartz构建输出的静态文件目录
          force_orphan: true     # 清空gh-pages分支历史，避免冲突
